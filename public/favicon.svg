<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Temple Structure -->
  <g fill="url(#goldGrad)">
    <!-- Pediment (Roof) -->
    <polygon points="64,22 20,46 108,46"/>
    <!-- Pediment inner cutout -->
    <polygon points="64,28 32,44 96,44" fill="#0f172a"/>
    <!-- Center Emblem -->
    <circle cx="64" cy="38" r="3.8" fill="url(#goldGrad)"/>

    <!-- Architrave Beam -->
    <rect x="18" y="47" width="92" height="7" rx="2"/>

    <!-- 4 Columns -->
    <rect x="25" y="55" width="12" height="3" rx="1" fill="#fef08a"/>
    <rect x="27" y="58" width="8" height="32" rx="1"/>
    <rect x="25" y="90" width="12" height="3" rx="1" fill="#d97706"/>

    <rect x="45" y="55" width="12" height="3" rx="1" fill="#fef08a"/>
    <rect x="47" y="58" width="8" height="32" rx="1"/>
    <rect x="45" y="90" width="12" height="3" rx="1" fill="#d97706"/>

    <rect x="71" y="55" width="12" height="3" rx="1" fill="#fef08a"/>
    <rect x="73" y="58" width="8" height="32" rx="1"/>
    <rect x="71" y="90" width="12" height="3" rx="1" fill="#d97706"/>

    <rect x="91" y="55" width="12" height="3" rx="1" fill="#fef08a"/>
    <rect x="93" y="58" width="8" height="32" rx="1"/>
    <rect x="91" y="90" width="12" height="3" rx="1" fill="#d97706"/>

    <!-- Base Steps -->
    <rect x="16" y="94" width="96" height="6" rx="2"/>
    <rect x="12" y="101" width="104" height="8" rx="2.5" fill="#d97706"/>
  </g>
</svg>
